{% extends "layout.html" %}
{% block title %}Edit Budget{% endblock %}

{% block body %}
    <div class="container">
        <div class="mb-4" style="display: flex; align-items: center; gap: 15px;">
            <a href="/budget" class="btn-secondary" style="width: 40px; height: 40px; border-radius: 50%;
                                                           display: flex; align-items: center; justify-content: center; text-decoration: none;">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h2 style="margin: 0;">Edit Budget</h2>
                <p class="text-muted" style="margin: 0; font-size: small;">Update your monthly limit.</p>
            </div>
        </div>

        <div class="card">
            <form action="/edit_budget?id={{ budget.id }}" method="POST">
                {% if message %}
                    <p style="color: #c94a4a; font-weight: bold;">{{ message }}</p>
                {% endif %}

                <div class="mb-4">
                    <label class="form-label" style="font-weight: 600; color: #3e322b;">Category</label>
                    <input type="text" class="form-control" value="{{ budget.name }}" disabled style="background-color: #f8f5f2;">
                    <small class="text-muted" style="font-size: small;">The category cannot be changed.</small>
                </div>

                <div class="mb-4">
                    <label class="form-label" style="font-weight: 600; color: #3e322b;">Monthly limit ({{ currency }})</label>
                    <input type="number" step="0.01" name="amount" class="form-control" value="{{ budget.amount }}">
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px;">
                    <button type="submit" name="action" value="delete" onclick="return confirm('Are you sure you want to delete this budget?');"
                            style="background: none; border: none; color: #c94a4a; font-weight: 600; cursor: pointer; padding: 10px 0;">
                        <i class="bi bi-trash"></i> Delete
                    </button>

                    <div style="display: flex; gap: 15px;">
                        <a href="/budget" class="btn-secondary" style="width: auto; padding: 10px 30px; text-decoration: none; text-align: center;">
                            Cancel
                        </a>
                        <button type="submit" class="btn-primary" style="width: auto; padding: 10px 30px;">
                            Save changes
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
