<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
        <title>cozycash - {% block title %}{% endblock %}</title>
    </head>
    <body>
        {% if session.get("id_account") %}
            <nav>
                <div class="nav-links">
                    <a href="/dashboard"><i class="bi bi-house"></i>Dashboard</a>
                    <a href="/transactions"><i class="bi bi-coin"></i>Transactions</a>
                    <a href="/budget"><i class="bi bi-wallet2"></i>Budget</a>
                    <a href="/settings"><i class="bi bi-gear"></i>Settings</a>
                </div>
                <button id="btn-logout" class="btn-secondary" style="width: auto; padding: 8px 20px; font-size: small;">Log Out</button>
            </nav>

            <div class="container">
                <h2>cozycash.</h2>
                <h5 class="text-muted" style="font-size: small;">Your personal finance space</h5>
                <hr>
            </div>
        {% endif %}

        {% block body %}{% endblock %}

        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
