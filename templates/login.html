{% extends "layout.html" %}

{% block title %}Login{% endblock %}

{% block body %}
    <div style="min-height: 600px; display: flex; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 400px; width: 100%; padding: 40px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="font-weight: 800; color: #3e322b; margin-bottom: 5px;">Welcome back</h2>
                <p class="text-muted" style="font-size: small;">Log in to your cozycash account.</p>
            </div>

            <form action="/login" method="POST">
                {% if message %}
                    <p style="color: #c94a4a; font-weight: bold; text-align: center; font-size: small;">{{ message }}</p>
                {% endif %}

                <div class="mb-4">
                    <label class="form-label" style="font-weight: 600; color: #3e322b;">Username</label>
                    <input autocomplete="off" name="username" placeholder="Enter your username" type="text" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label" style="font-weight: 600; color: #3e322b;">Password</label>
                    <input autocomplete="off" name="password" placeholder="Enter your password" type="password" class="form-control">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 10px;">
                    Login
                </button>
            </form>

            <div style="text-align: center; margin: 25px 0; color: #8c7a6b; font-size: small;">
                Don't have an account?
            </div>

            <button id="btn-register" class="btn-secondary">
                Create a new account
            </button>
        </div>
    </div>
{% endblock %}
