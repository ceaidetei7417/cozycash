{% extends "layout.html" %}

{% block title %}Register{% endblock %}

{% block body %}
    <div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
        <div class="card" style="max-width: 400px; width: 100%; padding: 40px;">
            <div style="text-align: center; margin-bottom: 30px;">
                <h2 style="font-weight: 800; color: #3e322b; margin-bottom: 5px;">Create an account</h2>
                <p class="text-muted" style="font-size: small;">Start managing your finances today.</p>
            </div>

            <form action="/register" method="POST">
                {% if message %}
                    <p style="color: #c94a4a; font-weight: bold; text-align: center; font-size: small;">{{ message }}</p>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label" style="font-weight: 600; color: #3e322b;">Username</label>
                    <input autocomplete="off" name="username" placeholder="Choose a username" type="text" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label" style="font-weight: 600; color: #3e322b;">Password</label>
                    <input autocomplete="off" name="password" placeholder="Create a password" type="password" class="form-control">
                </div>

                <div class="mb-4">
                    <label class="form-label" style="font-weight: 600; color: #3e322b;">Confirm Password</label>
                    <input autocomplete="off" name="confirm_password" placeholder="Repeat your password" type="password" class="form-control">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 10px;">
                    Create Account
                </button>
            </form>

            <div style="text-align: center; margin: 25px 0; color: #8c7a6b; font-size: small;">
                Already have an account?
            </div>

            <button id="btn-login" class="btn-secondary">
                Log in to your account
            </button>
        </div>
    </div>
{% endblock %}
